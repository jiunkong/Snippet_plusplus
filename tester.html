<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Snippet++ Test</title>
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="styles/prompt.css">
  <link rel="stylesheet" href="styles/tester.css">
</head>
<body class="test-surface i18n-loading">
  <div class="test-field">
    <label for="snippet-test-input" data-i18n="tester_input_label">한 줄 입력</label>
    <input id="snippet-test-input" type="text" autocomplete="off" spellcheck="false" data-i18n="tester_placeholder">
  </div>
  <div class="test-field">
    <label for="snippet-test-textarea" data-i18n="tester_textarea_label">여러 줄 입력</label>
    <textarea id="snippet-test-textarea" rows="6" spellcheck="false" data-i18n="tester_placeholder"></textarea>
  </div>
  <div class="test-field">
    <label id="snippet-test-rich-label" data-i18n="tester_rich_label">웹 편집기 입력</label>
    <p id="snippet-test-rich-description" class="test-field-description" data-i18n="tester_rich_description">일반 입력창과 구조가 다른 웹 편집기에서 스니펫 치환과 커서 이동을 확인하는 영역입니다.</p>
    <div id="snippet-test-rich" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="snippet-test-rich-label" aria-describedby="snippet-test-rich-description" spellcheck="false"></div>
  </div>
  <script src="utils/constants.js"></script>
  <script src="utils/config.js"></script>
  <script src="utils/i18n.js"></script>
  <script src="options/i18n.js"></script>
  <script src="utils/triggers.js"></script>
  <script src="content/evaluator.js"></script>
  <script src="content/state.js"></script>
  <script src="content/template.js"></script>
  <script src="content/dom.js"></script>
  <script src="content/expansion.js"></script>
  <script src="content/effects.js"></script>
  <script src="options/tester-runtime.js"></script>
  <script src="content/handlers.js"></script>
</body>
</html>
